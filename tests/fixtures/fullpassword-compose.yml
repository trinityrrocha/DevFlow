name: fullpassword
services:
  backend:
    image: fullpassword/backend:test
    restart: unless-stopped
    networks:
      - fullpassword_network
  nginx:
    image: nginx:alpine
    container_name: fullpassword_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: /opt/fullpassword/docker/nginx.runtime.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: /etc/letsencrypt
        target: /etc/letsencrypt
        read_only: true
    networks:
      - fullpassword_network
networks:
  fullpassword_network:
    driver: bridge
