name: devflow

services:
  db:
    image: postgres:16-alpine
    container_name: devflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-devflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatoria}
      POSTGRES_DB: ${DB_NAME:-devflow_db}
    expose: ["5432"]
    volumes:
      - devflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    labels:
      org.opencontainers.image.version: ${DEVFLOW_VERSION:-0.6.21-alpha}
      devflow.component: database
    networks: [devflow_internal]

  backend:
    image: devflow-backend:${DEVFLOW_IMAGE_TAG:-latest}
    container_name: devflow-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DEVFLOW_BUILD_VERSION: ${DEVFLOW_VERSION:-0.6.21-alpha}
        DEVFLOW_BUILD_COMMIT: ${DEVFLOW_RELEASE_COMMIT:-unknown}
    restart: unless-stopped
    env_file:
      - ${DEVFLOW_ENV_FILE:-.env}
    environment:
      DEVFLOW_VERSION: ${DEVFLOW_VERSION:-0.6.21-alpha}
      DEVFLOW_RELEASE_COMMIT: ${DEVFLOW_RELEASE_COMMIT:-unknown}
      DB_HOST: db
      DB_PORT: 5432
      MIGRATIONS_DIR: /database/migrations
      UPLOAD_DIR: /var/lib/devflow/uploads
      UPDATE_REQUEST_DIR: /var/lib/devflow-updater/requests
      UPDATE_STATUS_DIR: /var/lib/devflow-updater/status
    expose: ["3000"]
    volumes:
      - ${DEVFLOW_UPLOADS_PATH:-/opt/devflow/storage/uploads}:/var/lib/devflow/uploads
      - ${DEVFLOW_UPDATER_ROOT:-/opt/devflow/updater}:/var/lib/devflow-updater
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    labels:
      org.opencontainers.image.version: ${DEVFLOW_VERSION:-0.6.21-alpha}
      devflow.component: backend
    networks: [devflow_internal, devflow_edge]

  frontend:
    image: devflow-frontend:${DEVFLOW_IMAGE_TAG:-latest}
    container_name: devflow-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        DEVFLOW_BUILD_VERSION: ${DEVFLOW_VERSION:-0.6.21-alpha}
        DEVFLOW_BUILD_COMMIT: ${DEVFLOW_RELEASE_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      worker:
        condition: service_healthy
    expose: ["80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    labels:
      org.opencontainers.image.version: ${DEVFLOW_VERSION:-0.6.21-alpha}
      devflow.component: frontend
    networks: [devflow_edge]

  worker:
    image: devflow-backend:${DEVFLOW_IMAGE_TAG:-latest}
    container_name: devflow-worker
    restart: unless-stopped
    command: ["node", "src/workers/emailWorker.js"]
    env_file:
      - ${DEVFLOW_ENV_FILE:-.env}
    environment:
      DEVFLOW_VERSION: ${DEVFLOW_VERSION:-0.6.21-alpha}
      DEVFLOW_RELEASE_COMMIT: ${DEVFLOW_RELEASE_COMMIT:-unknown}
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const age=Date.now()-fs.statSync('/tmp/devflow-email-worker.ready').mtimeMs;process.exit(age<30000?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    labels:
      org.opencontainers.image.version: ${DEVFLOW_VERSION:-0.6.21-alpha}
      devflow.component: email-worker
    networks: [devflow_internal]

  edge:
    image: nginx:1.27-alpine
    container_name: devflow-nginx
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ${DEVFLOW_NGINX_CONFIG_PATH:-/opt/devflow/config/nginx/nginx.runtime.conf}:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    labels:
      org.opencontainers.image.version: ${DEVFLOW_VERSION:-0.6.21-alpha}
      devflow.component: proxy
    networks: [devflow_edge]

  updater:
    image: devflow-updater:${DEVFLOW_IMAGE_TAG:-latest}
    container_name: devflow-updater
    build:
      context: .
      dockerfile: docker/updater/Dockerfile
      args:
        DEVFLOW_BUILD_VERSION: ${DEVFLOW_VERSION:-0.6.21-alpha}
        DEVFLOW_BUILD_COMMIT: ${DEVFLOW_RELEASE_COMMIT:-unknown}
    restart: unless-stopped
    command: ["bash", "/opt/devflow/app/scripts/updater-daemon.sh"]
    env_file:
      - ${DEVFLOW_ENV_FILE:-.env}
    environment:
      APP_DIR: /opt/devflow
      UPDATER_REQUEST_DIR: /var/lib/devflow-updater
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/devflow:/opt/devflow
      - /run/lock/devflow:/run/lock/devflow
      - ${DEVFLOW_UPDATER_ROOT:-/opt/devflow/updater}:/var/lib/devflow-updater
    healthcheck:
      test: ["CMD", "test", "-f", "/var/lib/devflow-updater/daemon.ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    security_opt: ["no-new-privileges:true"]
    labels:
      org.opencontainers.image.version: ${DEVFLOW_VERSION:-0.6.21-alpha}
      devflow.component: updater
    networks: [devflow_internal, devflow_edge]

volumes:
  devflow_postgres_data:
    name: devflow_postgres_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEVFLOW_DB_DATA_PATH:-/opt/devflow/storage/postgres}
networks:
  devflow_internal:
    name: devflow_internal
    driver: bridge
    internal: true
  devflow_edge:
    name: devflow_edge
    driver: bridge
