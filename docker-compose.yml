name: devflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-devflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatória}
      POSTGRES_DB: ${DB_NAME:-devflow_db}
    expose:
      - "5432"
    volumes:
      - ${DEVFLOW_DB_DATA_PATH:-devflow_db_data}:/var/lib/postgresql/data
    labels:
      org.opencontainers.image.version: ${DEVFLOW_VERSION:-0.4.8-alpha}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - devflow_internal

  backend:
    image: devflow-backend:${DEVFLOW_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        DEVFLOW_BUILD_VERSION: ${DEVFLOW_VERSION:-0.4.8-alpha}
        DEVFLOW_BUILD_COMMIT: ${DEVFLOW_RELEASE_COMMIT:-unknown}
    restart: unless-stopped
    env_file:
      - ${DEVFLOW_ENV_FILE:-.env}
    environment:
      DEVFLOW_VERSION: ${DEVFLOW_VERSION:-0.4.8-alpha}
      DB_HOST: db
      DB_PORT: 5432
      MIGRATIONS_DIR: /database/migrations
      UPLOAD_DIR: /var/lib/devflow/uploads
    expose:
      - "3000"
    volumes:
      - ${DEVFLOW_UPLOADS_PATH:-devflow_uploads}:/var/lib/devflow/uploads
    labels:
      org.opencontainers.image.version: ${DEVFLOW_VERSION:-0.4.8-alpha}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - devflow_internal
      - devflow_edge

  frontend:
    image: devflow-frontend:${DEVFLOW_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        DEVFLOW_BUILD_VERSION: ${DEVFLOW_VERSION:-0.4.8-alpha}
        DEVFLOW_BUILD_COMMIT: ${DEVFLOW_RELEASE_COMMIT:-unknown}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      org.opencontainers.image.version: ${DEVFLOW_VERSION:-0.4.8-alpha}
    networks:
      - devflow_edge

  edge:
    image: nginx:1.27-alpine
    profiles: ["standalone"]
    restart: unless-stopped
    environment:
      DEVFLOW_DOMAIN: ${DEVFLOW_DOMAIN:?DEVFLOW_DOMAIN obrigatório}
      NGINX_ENVSUBST_FILTER: DEVFLOW_DOMAIN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/standalone.conf:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      org.opencontainers.image.version: ${DEVFLOW_VERSION:-0.4.8-alpha}
    networks:
      - devflow_edge

volumes:
  devflow_db_data:
  devflow_uploads:

networks:
  devflow_internal:
    driver: bridge
    internal: true
  devflow_edge:
    external: true
    name: devflow_edge
