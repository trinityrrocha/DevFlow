name: devflow-maintenance

services:
  maintenance:
    image: nginx:1.27-alpine
    container_name: devflow-maintenance
    restart: "no"
    environment:
      DEVFLOW_DOMAIN: ${DEVFLOW_DOMAIN:?DEVFLOW_DOMAIN obrigatorio}
      NGINX_ENVSUBST_FILTER: DEVFLOW_DOMAIN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/maintenance.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      org.opencontainers.image.version: ${DEVFLOW_VERSION:-0.5.5-alpha}
      devflow.component: maintenance
    networks:
      - devflow_edge

networks:
  devflow_edge:
    external: true
    name: devflow_edge
